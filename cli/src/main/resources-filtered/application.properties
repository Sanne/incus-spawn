quarkus.config.fixed-at-build-time=true
quarkus.banner.enabled=false
quarkus.log.min-level=WARN
quarkus.log.level=WARN
quarkus.log.console.stderr=true

# Native image config
quarkus.ssl.native=true
quarkus.native.builder-image=container-registry.oracle.com/graalvm/native-image:25i5-ol10
quarkus.native.auto-service-loader-registration=false
quarkus.native.resources.includes=mcp/*.cjs,images/*.yaml,tools/*.yaml,git-remote-isx,isx-trust,dev/tamboui/tui/bindings/*.properties,help/*.md,help/docs/*.md,help/design/*.md
quarkus.native.additional-build-args=--initialize-at-run-time=dev.incusspawn.Environment\\,dev.incusspawn.RuntimeConstants\\,dev.incusspawn.RuntimeServices\\,dev.tamboui.tui\\,dev.tamboui.toolkit\\,dev.tamboui.terminal\\,dev.tamboui.capability\\,dev.tamboui.error\\,dev.tamboui.widget\\,dev.tamboui.backend.panama,\
  --enable-native-access=ALL-UNNAMED,\
  ${native.optimization},--gc=serial${native.march.args},\
  --initialize-at-build-time=dev.tamboui.backend.panama.unix.PlatformConstants,\
  -H:-ParseRuntimeOptions,\
  -H:+UnlockExperimentalVMOptions,-H:+SharedArenaSupport,-H:-UseContainerSupport,-H:-JNIExportSymbols,-H:-AllowVMInternalThreads,\
  -H:AbortOnMethodReachable=java.io.ObjectInputStream.readObject0,-H:-UnlockExperimentalVMOptions,\
  -R:MaxRAM=512m,-R:ActiveProcessorCount=2${svm.target.name.args}${macos.plist.args}${macos.min.args},\
  --features=dev.incusspawn.graal.SyscallReachabilityFeature\\,dev.incusspawn.graal.BakedHostStateFeature\\,dev.incusspawn.graal.PlatformRoleFeature${native.pgo.args}
