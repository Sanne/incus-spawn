name: zmx
description: zmx 1.0.1 – session attach/detach for the terminal

parameters:
  auto_attach:
    type: boolean
    default: "true"
    description: "Automatically attach to a zmx session when shelling into the container"

downloads:
  - url: https://zmx.sh/a/zmx-1.0.1-linux-x86_64.tar.gz
    sha256: 47319ff9f330b65e14dc799517699d13c5f322820d08abecab99f8b18beaaa2d
    extract: /tmp/zmx-dl
    arch: x86_64
  - url: https://zmx.sh/a/zmx-1.0.1-linux-aarch64.tar.gz
    sha256: 868de83abc66dc59a5c864ecdef4d5cb763985eedf8b9c1099af9ce75e51fc6b
    extract: /tmp/zmx-dl
    arch: aarch64
run:
  - install -m 755 /tmp/zmx-dl/zmx /usr/local/bin/zmx
  - rm -rf /tmp/zmx-dl
  - mkdir -p /home/agentuser/.zmx && chown agentuser:agentuser /home/agentuser/.zmx
env:
  - name: ZMX_DIR
    value: /home/agentuser/.zmx
verify: zmx --version
