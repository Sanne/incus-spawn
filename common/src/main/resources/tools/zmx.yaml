name: zmx
description: zmx 0.8.1 – session attach/detach for the terminal

parameters:
  auto_attach:
    type: boolean
    default: "true"
    description: "Automatically attach to a zmx session when shelling into the container"

downloads:
  - url: https://zmx.sh/a/zmx-0.8.1-linux-x86_64.tar.gz
    sha256: dfd75720b942466f28870731cc86dbc07afa72fb8f3bd5eeb4ff707e4eecebe8
    extract: /tmp/zmx-dl
    arch: x86_64
  - url: https://zmx.sh/a/zmx-0.8.1-linux-aarch64.tar.gz
    sha256: 943eb44c812333fd450da12097521afd3339436e86f8c2ac618b905c4c9ece68
    extract: /tmp/zmx-dl
    arch: aarch64
run:
  - install -m 755 /tmp/zmx-dl/zmx /usr/local/bin/zmx
  - rm -rf /tmp/zmx-dl
  - mkdir -p /home/agentuser/.zmx && chown agentuser:agentuser /home/agentuser/.zmx
env:
  - name: ZMX_DIR
    value: /home/agentuser/.zmx
verify: zmx --version
