name: starship
description: Starship cross-shell prompt 1.27.0 with incus-spawn indicator

downloads:
  - url: https://github.com/starship/starship/releases/download/v1.27.0/starship-x86_64-unknown-linux-gnu.tar.gz
    sha256: 3b94758850901717eb36aa1b53f8492c1322506ec6d41273bc6151e79ed8e4a1
    extract: /tmp/starship
    arch: x86_64
  - url: https://github.com/starship/starship/releases/download/v1.27.0/starship-aarch64-unknown-linux-musl.tar.gz
    sha256: 341f5cbf24699fa0b27ec88965ad25f862ea09e15d35a543fd6ffdff1d2aa00d
    extract: /tmp/starship
    arch: aarch64

run:
  - install -m 755 /tmp/starship/starship /usr/local/bin/starship
  - rm -rf /tmp/starship

files:
  - path: /home/agentuser/.config/starship.toml
    owner: agentuser
    content: |
      format = """
      $custom\
      $directory\
      $git_branch\
      $git_status\
      $git_state\
      $cmd_duration\
      $line_break\
      $character"""

      [custom.incus_spawn]
      command = 'echo "$ISX_CONTAINER"'
      when = 'test -n "$ISX_CONTAINER"'
      format = "[\\[◆ $output\\]]($style) "
      style = "bold blue"
      description = "incus-spawn container indicator"

      [directory]
      truncation_length = 3
      read_only = " 🔒"

      [git_branch]
      format = "[$symbol$branch]($style) "

      [git_status]
      format = '([$all_status$ahead_behind]($style) )'

      [git_state]
      format = '[$state( $progress_current/$progress_total)]($style) '

      [cmd_duration]
      min_time = 2000
      format = "[⏱ $duration]($style) "

      [character]
      success_symbol = "[❯](green)"
      error_symbol = "[❯](red)"

run_as_user:
  - echo '[ "$TERM" != "dumb" ] && eval "$(starship init bash)"' >> ~/.bashrc

verify: starship --version
