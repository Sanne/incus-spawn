name: headroom
description: Headroom context optimization for Claude Code
requires:
  - claude

# The base image ships no system bus, and without one logind never starts the user
# manager that runs headroom-proxy.service: bring the bus, as the podman tool does.
#
# Headroom runs in its own venv on Python 3.14, not the system python3: Fedora 45's
# is 3.15, which its fastuuid dependency has no wheel for, and building one fails
# (PyO3 supports up to 3.14). On Fedora 44 python3 itself provides python3.14.
packages:
  - python3.14
  - systemd-pam
  - dbus-broker

run:
  # What 'loginctl enable-linger' writes, without needing logind running during the build
  - mkdir -p /var/lib/systemd/linger && touch /var/lib/systemd/linger/agentuser
  - |
    mkdir -p /etc/systemd/system/user@.service.d
    cat > /etc/systemd/system/user@.service.d/xdg-runtime.conf << 'EOF'
    [Service]
    Environment=XDG_RUNTIME_DIR=/run/user/%i
    EOF

run_as_user:
  - |
    python3.14 -m venv ~/.local/share/headroom &&
    ~/.local/share/headroom/bin/pip install --quiet 'headroom-ai[proxy,mcp]' &&
    mkdir -p ~/.local/bin &&
    ln -sf ../share/headroom/bin/headroom ~/.local/bin/headroom
  - claude mcp add headroom -s user -- headroom mcp serve
  - |
    mkdir -p ~/.config/systemd/user/default.target.wants
    cat > ~/.config/systemd/user/headroom-proxy.service << 'EOF'
    [Unit]
    Description=Headroom optimization proxy

    [Service]
    ExecStart=%h/.local/bin/headroom proxy
    Restart=on-failure
    RestartSec=3

    [Install]
    WantedBy=default.target
    EOF
    ln -sf ../headroom-proxy.service ~/.config/systemd/user/default.target.wants/headroom-proxy.service

env:
  - name: ANTHROPIC_BASE_URL
    value: "http://localhost:8787"

verify: /home/agentuser/.local/bin/headroom --version

ready: curl -sf http://localhost:8787/livez
