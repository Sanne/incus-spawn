# yaml-language-server: $schema=https://isx.run/schema/tool.json
name: idea-backend
description: JetBrains IntelliJ IDEA Remote Development backend 2026.3.0.1
requires:
  - sshd

packages:
  - tar
  - unzip

parameters:
  memory:
    type: string
    default: "2g"
    description: "JVM heap size (e.g. 2g, 4g, 8g)"
    pattern: "^[0-9]+[gGmM]$"
  index-mcp:
    type: boolean
    default: "false"
    description: "Install the IDE Index MCP Server plugin and register it in Claude Code"

# The heap may grow to its -Xmx, and the JVM holds about 900 MiB beside it (metaspace, code cache,
# threads, mapped index files): docs/dev/PERFORMANCE-NOTES.md "Memory a template's tools need".
resources:
  memory:
    resident: { parameter: memory, plus: 1GiB }

downloads:
  - url: https://download.jetbrains.com/idea/idea-2026.3.0.1.tar.gz
    sha256: def869cc0109273f5a144ac669c739029e9bd5178d137213b8d15298c0055858
    extract: /opt
    extract_in_container: true
    arch: x86_64
  - url: https://download.jetbrains.com/idea/idea-2026.3.0.1-aarch64.tar.gz
    sha256: 72cd5618cece2d06e4cfa6fb4b692fcdc7e6d59aaf811e67e9ba4871e02495b6
    extract: /opt
    extract_in_container: true
    arch: aarch64

  # The IDE Index MCP Server plugin, installed by run_as_user below when index-mcp is true. It is
  # fetched on every build, and the upstream watch moves its pin (item idea-index-plugin).
  - url: https://github.com/hechtcarmel/jetbrains-index-mcp-plugin/releases/download/5.20.9/jetbrains-index-mcp-plugin-5.20.9-signed.zip
    sha256: ea3e87ffdae327f607aa93bccc295ac9fe6f8b6085ff6e520927e60c26eea37d
    destination_file: /opt/index-mcp-plugin.zip

run:
  - ln -snf /opt/idea-IU-* /opt/idea

run_as_user:
  - |
    IJ_CFG_DIR=~/.config/JetBrains/$(grep -o '"dataDirectoryName": "[^"]*"' /opt/idea/product-info.json | head -1 | cut -d'"' -f4)
    mkdir -p "$IJ_CFG_DIR"
    printf -- '\n-Xmx${param_memory}\n' >> "$IJ_CFG_DIR/idea64.vmoptions"
  - /opt/idea/bin/remote-dev-server.sh registerBackendLocationForGateway
  - |
    set -e
    if [ "${param_index-mcp}" = "true" ]; then
      if ! command -v claude >/dev/null 2>&1; then
        echo "idea-backend index-mcp: true registers the IDE Index MCP Server in Claude Code, which is not installed yet: install claude in a parent template or list it before idea-backend" >&2
        exit 1
      fi
      IJ_DATA_DIR=~/.local/share/JetBrains/$(grep -o '"dataDirectoryName": "[^"]*"' /opt/idea/product-info.json | head -1 | cut -d'"' -f4)
      IJ_CFG_DIR=~/.config/JetBrains/$(grep -o '"dataDirectoryName": "[^"]*"' /opt/idea/product-info.json | head -1 | cut -d'"' -f4)
      PLUGIN_DIR="$IJ_DATA_DIR/plugins"
      mkdir -p "$PLUGIN_DIR" "$IJ_CFG_DIR/options"
      unzip -qo /opt/index-mcp-plugin.zip -d "$PLUGIN_DIR"
      cat > "$IJ_CFG_DIR/options/mcp-plugin.xml" << 'MCPCFG'
    <application>
      <component name="McpPluginSettings">
        <option name="serverPort" value="29170" />
        <option name="disabledTools">
          <set />
        </option>
      </component>
    </application>
    MCPCFG
      claude mcp add --transport http --scope user intellij-index http://127.0.0.1:29170/index-mcp/streamable-http
    fi

verify: test -x /opt/idea/bin/remote-dev-server.sh && if [ "${param_index-mcp}" = "true" ]; then ls -d ~/.local/share/JetBrains/*/plugins/jetbrains-index-mcp-plugin >/dev/null; fi

actions:
  - label: "Open repo '${repo_name}' in Gateway"
    type: url
    expand: repos
    url: "jetbrains-gateway://connect#idePath=%2Fopt%2Fidea&host=${name}&port=22&user=agentuser&type=ssh&deploy=false&projectPath=${repo_path}"
    shell_menu: true
    shortcut: g
