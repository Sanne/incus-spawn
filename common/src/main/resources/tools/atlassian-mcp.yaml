# yaml-language-server: $schema=https://isx.run/schema/tool.json
name: atlassian-mcp
description: Atlassian MCP server for Jira and Confluence
agent_note: |
  The Atlassian MCP server uses API tokens scoped to one Atlassian site.
  The `getAccessibleAtlassianResources` call returns empty with API tokens;
  pass the site URL directly as `cloudId` (e.g. `https://mysite.atlassian.net`).
env:
  - name: ATLASSIAN_MCP_AUTH
    value: atlassian-placeholder
proxy:
  config-namespace: atlassian
  placeholders:
    - env: ATLASSIAN_MCP_AUTH
      prefix: atlassian-
  configuration:
    email:
      config-path: "email"
      description: "Atlassian account email"
    api-token:
      config-path: "apiToken"
      description: "Atlassian personal API token"
      secret: true
      help:
        - "1. An admin of your Atlassian organization must allow API"
        - "   tokens: admin.atlassian.com > Rovo > Rovo MCP server >"
        - "   Authentication."
        - ""
        - "2. Create a token at:"
        - "   https://id.atlassian.com/manage-profile/security/api-tokens?autofillToken&expiryDays=max&appId=mcp-v2"
        - "   Pick its scopes on that page. To read, pick:"
        - "     read:jira, search:jira, read:confluence,"
        - "     search:confluence"
        - "   To write as well, add write:jira and write:confluence."
        - "   Every scope is described at:"
        - "     https://support.atlassian.com/atlassian-ai-gateway/docs/supported-tools/"
  auth:
    - domains:
        - mcp.atlassian.com
      type: basic
      username: "${email}"
      password: "${api-token}"
mcp:
  - name: atlassian
    description: Jira and Confluence on the account's Atlassian site
    url: https://mcp.atlassian.com/v2/mcp
    bearer-token-env: ATLASSIAN_MCP_AUTH
