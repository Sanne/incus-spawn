name: atlassian-mcp
description: Atlassian MCP server for Jira and Confluence
proxy:
  config-namespace: atlassian
  configuration:
    email:
      config-path: "email"
      description: "Atlassian account email"
    api-token:
      config-path: "apiToken"
      description: "Atlassian personal API token"
      secret: true
      help:
        - "1. An org admin must enable API token auth at:"
        - "   admin.atlassian.com > Rovo > Rovo MCP server > Authentication"
        - ""
        - "2. Create a token at:"
        - "   https://id.atlassian.com/manage-profile/security/api-tokens?autofillToken&expiryDays=max&appId=mcp-v2"
        - "   Select scopes on the creation page. Recommended:"
        - "     Read-only:  read:jira, search:jira, read:confluence, search:confluence"
        - "     Add writes: write:jira, write:confluence"
        - "   Full scope reference:"
        - "     https://support.atlassian.com/atlassian-ai-gateway/docs/supported-tools/"
        - ""
        - "3. After setup, tell your AI agent to use your site URL directly"
        - "   as cloudId (e.g. https://mysite.atlassian.net). The"
        - "   getAccessibleAtlassianResources call returns empty with API"
        - "   tokens; pass the site URL instead."
  auth:
    - domains:
        - mcp.atlassian.com
      type: basic
      username: "${email}"
      password: "${api-token}"
run_as_user:
  - '/home/agentuser/.local/bin/claude mcp add -t http -s user atlassian https://mcp.atlassian.com/v2/mcp -H "Authorization: Basic $(echo -n placeholder:placeholder | base64)"'
