    sha256: 80ffca22aed9e8b9713a232f3394fd81d7f20322df75efdb2b047dbd3e3a23bb
    extract: /opt
    links:
      /opt/apache-maven-3.9.16/bin/mvn: /usr/local/bin/mvn
  - url: https://raw.github.com/juven/maven-bash-completion/216cd667b6119fe200c98b1ac2d030ac002be197/bash_completion.bash
    sha256: 6efc49869824f844cb489b69920af33f2fccd44e97d90c8b1584677e0ac5f432
    destination_file: ~/.bashrc.d/maven-bash-completion.sh

env:
  - name: MAVEN_HOME
    value: /opt/apache-maven-3.9.16

verify: mvn --version
