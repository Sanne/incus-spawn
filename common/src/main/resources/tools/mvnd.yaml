name: mvnd
description: Apache Maven Daemon 1.x

# `mvnd` is not a name an agent can interpret, so without this it reaches for `mvn`
# and pays JVM startup plus a cold cache on every build.
agent_note: |
  `mvnd` is Maven running as a resident daemon: prefer it over `mvn` for repeated
  builds in the same repo, where it avoids JVM startup and keeps caches warm. It
  takes the same goals and flags as `mvn`.

downloads:
  - url: https://archive.apache.org/dist/maven/mvnd/1.0.6/maven-mvnd-1.0.6-linux-amd64.zip
    sha256: 1a1c2ad0de53669c6d2bf64e2b6bcc7cb96f592c543230f00b4209002b19083c
    arch: x86_64
    extract: /opt
    links:
      /opt/maven-mvnd-1.0.6-linux-amd64/bin/mvnd: /usr/local/bin/mvnd
  - url: https://archive.apache.org/dist/maven/mvnd/1.0.6/maven-mvnd-1.0.6-linux-aarch64.zip
    sha256: f23c319112f9f1ac50082eed2768f24551420fd2f31773045679de1e831588b7
    arch: aarch64
    extract: /opt
    links:
      /opt/maven-mvnd-1.0.6-linux-aarch64/bin/mvnd: /usr/local/bin/mvnd

run:
  - mvnd --completion bash > /usr/share/bash-completion/completions/mvnd

verify: mvnd --version
