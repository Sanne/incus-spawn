quarkus.config.fixed-at-build-time=true
quarkus.banner.enabled=false
quarkus.log.min-level=WARN
quarkus.log.level=WARN
quarkus.log.console.stderr=true
quarkus.vertx.event-loops-pool-size=2
quarkus.vertx.caching=false
quarkus.vertx.classpath-resolving=false
quarkus.vertx.native-transport=${proxy.native.transport}
# The same, for the startup log (ProxyMain.transport): Quarkus keeps the setting above to the build.
isx.native-transport=${proxy.native.transport}

# Native image config
quarkus.native.resources.includes=tools/*.yaml
quarkus.ssl.native=true
quarkus.native.builder-image=container-registry.oracle.com/graalvm/native-image:25i5-ol10
quarkus.native.auto-service-loader-registration=false
quarkus.native.additional-build-args=--initialize-at-run-time=dev.incusspawn.Environment\\,dev.incusspawn.RuntimeConstants,\
  ${native.optimization},--gc=${proxy.native.gc}${native.march.args},\
  -H:-ParseRuntimeOptions,\
  -H:+UnlockExperimentalVMOptions,-H:-UseContainerSupport,-H:-JNIExportSymbols,\
  -H:AbortOnMethodReachable=java.io.ObjectInputStream.readObject0,-H:-UnlockExperimentalVMOptions,\
  -R:MaxRAM=${proxy.native.max.ram},-R:ActiveProcessorCount=4${svm.target.name.args}${macos.min.args},\
  --features=dev.incusspawn.graal.SyscallReachabilityFeature\\,dev.incusspawn.graal.BakedHostStateFeature\\,dev.incusspawn.graal.PlatformRoleFeature${native.pgo.args}
