name: Preview site

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/*.md'
      - 'site/**'
      - '.github/workflows/preview.yml'

# This run builds the PR's own site/build.sh, a fork's included, so it holds no secret and a
# read-only token. Deploying is preview-deploy.yml's job: it takes the built _site as an artifact
# and never runs anything from the PR (#2180).
permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # build.sh dates the sitemap from each page's last commit
          persist-credentials: false

      - name: Build site
        run: site/build.sh

      - name: Upload site
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: site-preview
          path: _site
          retention-days: 3
          if-no-files-found: error
