name: Docs Gates

# test-integration.yml ignores a change to these paths alone, so the tests guarding them would never
# run on it (#1960). This runs only those: every test tagged `docs`, in common and cli. The paths are
# test-integration.yml's paths-ignore, which DocsGatesWorkflowTest keeps equal.
on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Oracle GraalVM 25.5
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          version: '25.5'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        id: maven-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-docs-gates-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-docs-gates-

      - name: Run the docs gates
        run: .github/scripts/mvn-ci.sh '${{ steps.maven-cache.outputs.cache-hit }}' -B -ntp -pl common,cli -am test -Dgroups=docs
