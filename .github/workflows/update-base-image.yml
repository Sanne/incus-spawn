name: Update base image

# Keeps the built-in base-image tag in common/src/main/resources/images/minimal.yaml
# in step with the newest release of the Sanne/incus-spawn-images repo. That tag is
# the offline fallback used when a build cannot reach the release list; "track latest"
# resolves the newest release at build time, but this keeps the fallback from drifting.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve newest base image release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"

          # Single source of truth: derive the owning repo from the image_url.
          IMAGES_REPO="$(yq -r '.image_url' "$YAML" \
            | sed -E 's#https://github.com/([^/]+/[^/]+)/.*#\1#')"
          CURRENT_TAG="$(yq -r '.image_tag' "$YAML")"
          LATEST_TAG="$(gh api "repos/$IMAGES_REPO/releases" \
            --jq '[.[] | select(.tag_name | startswith("fedora-"))][0].tag_name')"

          echo "repo=$IMAGES_REPO"       >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_TAG"    >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST_TAG"      >> "$GITHUB_OUTPUT"
          echo "Current built-in tag: $CURRENT_TAG"
          echo "Latest release tag:   $LATEST_TAG"

          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "Could not resolve a latest release; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$LATEST_TAG" == "$CURRENT_TAG" ]]; then
            echo "Already current; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update minimal.yaml
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES_REPO: ${{ steps.latest.outputs.repo }}
          LATEST_TAG: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"

          SUMS_URL="$(gh api "repos/$IMAGES_REPO/releases/tags/$LATEST_TAG" \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url')"
          if [[ -z "$SUMS_URL" ]]; then
            echo "Release $LATEST_TAG has no SHA256SUMS asset; aborting." >&2
            exit 1
          fi
          curl -fsSL "$SUMS_URL" -o SHA256SUMS

          # <sha>  <filename>; -vm distinguishes the VM disk image from the container rootfs.
          sha_for() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS; }
          C_X86="$(sha_for "fedora-44-x86_64.tar.xz")"
          C_ARM="$(sha_for "fedora-44-aarch64.tar.xz")"
          V_X86="$(sha_for "fedora-44-x86_64-vm.tar.xz")"
          V_ARM="$(sha_for "fedora-44-aarch64-vm.tar.xz")"

          for pair in "container/x86_64:$C_X86" "container/aarch64:$C_ARM" \
                      "vm/x86_64:$V_X86" "vm/aarch64:$V_ARM"; do
            if [[ -z "${pair#*:}" ]]; then
              echo "Missing checksum for ${pair%%:*} in $LATEST_TAG; aborting." >&2
              exit 1
            fi
          done

          yq -i "
            .image_tag = \"$LATEST_TAG\" |
            .image_sha256.x86_64 = \"$C_X86\" |
            .image_sha256.aarch64 = \"$C_ARM\" |
            .vm_image_sha256.x86_64 = \"$V_X86\" |
            .vm_image_sha256.aarch64 = \"$V_ARM\"
          " "$YAML"

          rm -f SHA256SUMS
          echo "Updated $YAML to $LATEST_TAG"
          git diff -- "$YAML"

      - name: Open pull request
        if: steps.latest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.latest.outputs.latest }}
          CURRENT_TAG: ${{ steps.latest.outputs.current }}
        run: |
          set -euo pipefail
          BRANCH="bot/update-base-image-$LATEST_TAG"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; a PR is likely already open. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add common/src/main/resources/images/minimal.yaml
          git commit -m "Update base image to $LATEST_TAG"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Update base image to $LATEST_TAG" \
            --body "Bumps the built-in base-image fallback from \`$CURRENT_TAG\` to \`$LATEST_TAG\` (newest release of Sanne/incus-spawn-images), refreshing the container and VM checksums.

          Builds already track the latest release at build time when unpinned; this keeps the offline fallback current." \
            --base main \
            --head "$BRANCH"
