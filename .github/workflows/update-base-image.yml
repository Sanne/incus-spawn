name: Update base image

# Keeps the built-in base-image tag in common/src/main/resources/images/minimal.yaml
# in step with the newest release of the Sanne/incus-spawn-images repo. That tag is
# the offline fallback used when a build cannot reach the release list; "track latest"
# resolves the newest release at build time, but this keeps the fallback from drifting.
#
# Event-driven (push model): the images repo fires a `base-image-released`
# repository_dispatch when it publishes a release, carrying the tag and checksums
# in the payload, so there is nothing to poll. The manual `workflow_dispatch` path
# is a backstop that takes the newest release from the images repo's release list
# (used if a dispatch is ever missed).
#
# Either way only the tag is taken as given (#1678). Every checksum comes from the
# release's own SHA256SUMS and SHA256SUMS.v2, for the asset names minimal.yaml's
# URLs download (.github/scripts/base-image-sums.sh), and a payload whose checksums
# differ from them stops the run. verify-base-image-checksums.yml checks the PR again.
#
# A release of a newer Fedora (fedora-45-... while the built-in is on fedora-44) is named for its
# own release line: the bump moves the image alias and both URLs' file names to it, and says so
# in the PR. A release of an older line stops the run (#1862).
#
# A release carries two VM images (#1255): the stock-based -vm.tar.xz, listed in
# SHA256SUMS for isx releases before this reader, and the one built from scratch,
# -vm-direct.tar.xz, listed only in SHA256SUMS.v2. When a release has the direct
# one for both arches, the bump points vm_image_url at it; otherwise it keeps the
# stock image. The PR says which.

on:
  repository_dispatch:
    types: [base-image-released]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-26.04
    steps:
      # Check out with BOT_TOKEN so the branch push and PR are made by that token
      # rather than the default GITHUB_TOKEN — this both avoids needing the org
      # "Actions may create pull requests" setting and lets the resulting PR run CI
      # (PRs opened by GITHUB_TOKEN are deliberately blocked from triggering workflows).
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Resolve release + checksums
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"
          CURRENT_TAG="$(yq -r '.image_tag' "$YAML")"

          IMAGE_URL="$(yq -r '.image_url' "$YAML")"
          VM_URL="$(yq -r '.vm_image_url' "$YAML")"
          . .github/scripts/base-image-sums.sh
          # Single source of truth: derive the owning repo from the URLs.
          IMAGES_REPO="$(release_repo "$IMAGE_URL" "$VM_URL")"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            # The tag is the push signal; the sums still come from the release itself (#1678).
            TAG="$(jq -r '.tag // empty' <<<"$PAYLOAD")"
          else
            # Manual backstop: the images repo's newest release.
            TAG="$(gh api "repos/$IMAGES_REPO/releases" \
              --jq '[.[] | select(.tag_name | startswith("fedora-"))][0].tag_name')"
          fi
          SUMS="$(mktemp -d)"
          trap 'rm -rf "$SUMS"' EXIT
          fetch_release_sums "$IMAGES_REPO" "$TAG" "$SUMS"

          # A release of the next Fedora (#1862): its assets are named for its own release line, so
          # the image alias and both URLs' file names move from the built-in's line to the tag's.
          # Only forward, and only when the built-in names its own line where the move rewrites it.
          IMAGE="$(yq -r '.image' "$YAML")"
          CUR_LINE="$(release_line "$CURRENT_TAG")"
          NEW_LINE="$(release_line "$TAG")"
          LINE_MOVE=""
          if [[ "$NEW_LINE" != "$CUR_LINE" ]]; then
            if [[ "${CUR_LINE%-*}" != "${NEW_LINE%-*}" ]] || (( 10#${NEW_LINE##*-} <= 10#${CUR_LINE##*-} )); then
              echo "Release $TAG is not a newer release line than the built-in's $CURRENT_TAG; aborting." >&2
              exit 1
            fi
            IMAGE="$(move_line "$IMAGE" "$CUR_LINE" "$NEW_LINE")"
            IMAGE_URL="${IMAGE_URL%/*}/$(move_line "${IMAGE_URL##*/}" "$CUR_LINE" "$NEW_LINE")"
            VM_URL="${VM_URL%/*}/$(move_line "${VM_URL##*/}" "$CUR_LINE" "$NEW_LINE")"
            LINE_MOVE="$CUR_LINE:$NEW_LINE"
          fi

          # The names come from the built-in's own URLs: the VM file is either kind, so both are
          # derived from whichever it names now.
          CURRENT_VM_FILE="${VM_URL##*/}"
          case "$CURRENT_VM_FILE" in
            *-vm.tar.xz | *-vm-direct.tar.xz) VM_BASE="${CURRENT_VM_FILE%-vm*.tar.xz}" ;;
            *) echo "vm_image_url names neither a -vm.tar.xz nor a -vm-direct.tar.xz: $VM_URL; aborting." >&2
               exit 1 ;;
          esac
          STOCK_VM_FILE="$VM_BASE-vm.tar.xz"
          DIRECT_VM_FILE="$VM_BASE-vm-direct.tar.xz"
          C_X86_ASSET="$(asset_name "$IMAGE_URL" "$TAG" x86_64)"
          C_ARM_ASSET="$(asset_name "$IMAGE_URL" "$TAG" aarch64)"
          C_X86="$(release_sum "$SUMS" "$C_X86_ASSET")"
          C_ARM="$(release_sum "$SUMS" "$C_ARM_ASSET")"

          # The direct image for both arches, or not at all: one arch's would leave the
          # other with a URL and no checksum.
          VM_KIND=stock
          WANT_VM_FILE="$STOCK_VM_FILE"
          if release_lists "$SUMS" "$(asset_name "$DIRECT_VM_FILE" "$TAG" x86_64)" \
              && release_lists "$SUMS" "$(asset_name "$DIRECT_VM_FILE" "$TAG" aarch64)"; then
            VM_KIND=direct
            WANT_VM_FILE="$DIRECT_VM_FILE"
          elif [[ "$CURRENT_VM_FILE" == "$DIRECT_VM_FILE" ]]; then
            # Never back to the stock image unasked: a release missing the direct one is a
            # broken release, not a reason to move every user's VMs.
            echo "Release $TAG lacks -vm-direct for both arches, and the built-in already uses it; aborting." >&2
            exit 1
          fi
          V_X86_ASSET="$(asset_name "$WANT_VM_FILE" "$TAG" x86_64)"
          V_ARM_ASSET="$(asset_name "$WANT_VM_FILE" "$TAG" aarch64)"
          V_X86="$(release_sum "$SUMS" "$V_X86_ASSET")"
          V_ARM="$(release_sum "$SUMS" "$V_ARM_ASSET")"

          # A sum the payload carries must be the release's: a difference means the images repo's
          # release and its dispatch are out of step, and neither can be picked.
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            mismatch=0
            for check in "container.x86_64:$C_X86_ASSET" "container.aarch64:$C_ARM_ASSET" \
                         "vm.x86_64:$(asset_name "$STOCK_VM_FILE" "$TAG" x86_64)" \
                         "vm.aarch64:$(asset_name "$STOCK_VM_FILE" "$TAG" aarch64)" \
                         "vm_direct.x86_64:$(asset_name "$DIRECT_VM_FILE" "$TAG" x86_64)" \
                         "vm_direct.aarch64:$(asset_name "$DIRECT_VM_FILE" "$TAG" aarch64)"; do
              field="${check%%:*}" asset="${check#*:}"
              sent="$(jq -r ".sha256.$field // empty" <<<"$PAYLOAD")"
              [[ -z "$sent" ]] && continue
              derived="$(release_sum "$SUMS" "$asset" || true)"
              if [[ "$sent" != "$derived" ]]; then
                echo "The payload's sha256.$field ($sent) is not the release's sum for $asset (${derived:-none})." >&2
                mismatch=1
              fi
            done
            [[ "$mismatch" == 0 ]] || { echo "Release $TAG and its dispatch disagree; aborting." >&2; exit 1; }
          fi

          {
            echo "tag=$TAG"
            echo "current=$CURRENT_TAG"
            echo "c_x86=$C_X86"
            echo "c_arm=$C_ARM"
            echo "v_x86=$V_X86"
            echo "v_arm=$V_ARM"
            echo "vm_kind=$VM_KIND"
            echo "vm_file=$WANT_VM_FILE"
            echo "image=$IMAGE"
            echo "image_url=$IMAGE_URL"
            echo "line_move=$LINE_MOVE"
          } >> "$GITHUB_OUTPUT"

          echo "Current built-in tag: $CURRENT_TAG"
          echo "Incoming release tag: $TAG"
          # Current means the same tag, VM image and checksums: a stock-image bump of this
          # very release, already merged, still leaves the switch to -vm-direct to make.
          CURRENT_SUMS="$(yq -r '[.image_sha256.x86_64, .image_sha256.aarch64, .vm_image_sha256.x86_64, .vm_image_sha256.aarch64] | join(" ")' "$YAML")"
          # Said in the PR, since the trust root changes with them: the same tag with other
          # checksums is a release published again, and a new VM file is a switch of image.
          # Published again: under the same tag, a file that was there before has another
          # checksum; a VM file the built-in did not use yet is a switch, not that.
          CURRENT_C="$(yq -r '[.image_sha256.x86_64, .image_sha256.aarch64] | join(" ")' "$YAML")"
          CURRENT_V="$(yq -r '[.vm_image_sha256.x86_64, .vm_image_sha256.aarch64] | join(" ")' "$YAML")"
          if [[ "$TAG" == "$CURRENT_TAG" ]] && { [[ "$CURRENT_C" != "$C_X86 $C_ARM" ]] \
                || { [[ "$CURRENT_VM_FILE" == "$WANT_VM_FILE" ]] && [[ "$CURRENT_V" != "$V_X86 $V_ARM" ]]; }; }; then
            echo "republished=true" >> "$GITHUB_OUTPUT"
          fi
          [[ "$CURRENT_VM_FILE" != "$WANT_VM_FILE" ]] && echo "vm_switch=true" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == "$CURRENT_TAG" && "$CURRENT_VM_FILE" == "$WANT_VM_FILE" \
                && "$CURRENT_SUMS" == "$C_X86 $C_ARM $V_X86 $V_ARM" ]]; then
            echo "Already current; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update minimal.yaml
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          C_X86: ${{ steps.resolve.outputs.c_x86 }}
          C_ARM: ${{ steps.resolve.outputs.c_arm }}
          V_X86: ${{ steps.resolve.outputs.v_x86 }}
          V_ARM: ${{ steps.resolve.outputs.v_arm }}
          VM_FILE: ${{ steps.resolve.outputs.vm_file }}
          IMAGE: ${{ steps.resolve.outputs.image }}
          IMAGE_URL: ${{ steps.resolve.outputs.image_url }}
        run: |
          set -euo pipefail
          YAML="common/src/main/resources/images/minimal.yaml"
          VM_URL="$(yq -r '.vm_image_url' "$YAML")"
          VM_URL="${VM_URL%/*}/$VM_FILE"
          yq -i "
            .image = \"$IMAGE\" |
            .image_url = \"$IMAGE_URL\" |
            .vm_image_url = \"$VM_URL\" |
            .image_tag = \"$TAG\" |
            .image_sha256.x86_64 = \"$C_X86\" |
            .image_sha256.aarch64 = \"$C_ARM\" |
            .vm_image_sha256.x86_64 = \"$V_X86\" |
            .vm_image_sha256.aarch64 = \"$V_ARM\"
          " "$YAML"
          echo "Updated $YAML to $TAG"
          git diff -- "$YAML"

      - name: Open pull request
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CURRENT_TAG: ${{ steps.resolve.outputs.current }}
          VM_KIND: ${{ steps.resolve.outputs.vm_kind }}
          REPUBLISHED: ${{ steps.resolve.outputs.republished }}
          VM_SWITCH: ${{ steps.resolve.outputs.vm_switch }}
          LINE_MOVE: ${{ steps.resolve.outputs.line_move }}
          C_X86: ${{ steps.resolve.outputs.c_x86 }}
          C_ARM: ${{ steps.resolve.outputs.c_arm }}
          V_X86: ${{ steps.resolve.outputs.v_x86 }}
          V_ARM: ${{ steps.resolve.outputs.v_arm }}
        run: |
          set -euo pipefail
          # A -vm-direct bump has a branch of its own, so a stock-image bump of the same
          # release, opened before this reader existed, does not stand in its way; so has the
          # bump of a release published again under its tag, named by all four new checksums,
          # so a later re-publish that changes any one of them is not taken for this one.
          BRANCH="bot/update-base-image-$TAG"
          [[ "$VM_KIND" == direct ]] && BRANCH="$BRANCH-vm-direct"
          if [[ "$REPUBLISHED" == true ]]; then
            BRANCH="$BRANCH-$(printf '%s %s %s %s' "$C_X86" "$C_ARM" "$V_X86" "$V_ARM" | sha256sum | cut -c1-12)"
          fi

          TITLE="Update base image to $TAG"
          SUMMARY="Bumps the built-in base-image fallback from \`$CURRENT_TAG\` to \`$TAG\` (newest release of Sanne/incus-spawn-images), refreshing the container and VM checksums."
          if [[ "$REPUBLISHED" == true ]]; then
            TITLE="Base image $TAG was published again: new checksums"
            SUMMARY="**Same tag, checksums changed.** Release \`$TAG\` of Sanne/incus-spawn-images was published again under the tag the built-in already names, with different files. Check every checksum against the release before merging: they are what every base-image download is verified against."
          fi
          [[ -n "$LINE_MOVE" ]] && TITLE="Move base image to ${LINE_MOVE#*:} ($TAG)"
          [[ "$VM_SWITCH" == true && "$VM_KIND" == direct ]] && TITLE="$TITLE, VM image built from scratch"
          if [[ -n "$LINE_MOVE" ]]; then
            SUMMARY="$SUMMARY

          **Release line: \`${LINE_MOVE%%:*}\` to \`${LINE_MOVE#*:}\`.** The image alias and the asset names in both URLs move with it. Every template rebuilds on the new release; test them before merging."
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; a PR is likely already open. Skipping."
            exit 0
          fi

          # The PR check's own report on the bumped file: each checksum beside the asset it was matched
          # to, and the command that lists them, so a reviewer can repeat the check in one line.
          SUMS_TABLE="$(bash .github/scripts/verify-base-image-sums.sh common/src/main/resources/images/minimal.yaml)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add common/src/main/resources/images/minimal.yaml
          git commit -m "$TITLE"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "$TITLE" \
            --body "$SUMMARY

          VM image: \`$VM_KIND\` (\`direct\` is the image built from scratch, \`-vm-direct.tar.xz\`, listed in SHA256SUMS.v2; \`stock\` is \`-vm.tar.xz\`).

          Each checksum was taken from the release's own sums files, for the asset its URL downloads:

          $SUMS_TABLE

          The \`verify-base-image-checksums\` check does the same on this PR; do not merge it unless that check ran and passed.

          Builds already track the latest release at build time when unpinned; this keeps the offline fallback current." \
            --base main \
            --head "$BRANCH"
