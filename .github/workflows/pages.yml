name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # build.sh dates the sitemap from each page's last commit

      - name: Build site
        run: site/build.sh

      # Served by Cloudflare Pages, not GitHub Pages: isx.run is proxied by
      # Cloudflare, which stops GitHub from renewing its own certificate for
      # the domain (it expired on 2026-09-30 and the site went down with a 526).
      # A branch named after the project's production branch deploys to production.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=isx --branch=main
