name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.4'
          java-version: '25'
          distribution: 'graalvm'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-
      - name: Repeat the test
        run: |
          mvn -B -ntp -q install -DskipTests -pl common,proxy -am
          cd proxy
          mvn -B -ntp test -Dtest='ArtifactCacheProxyTest#clientThatStopsReadingIsNotTakenForAStalledUpstream' 2>&1 | grep -a "DIAG\|Tests run:\|FAIL\|^[0-9]" || true
      - name: Whole class with the repeats
        run: |
          cd proxy
          mvn -B -ntp test -Dtest='ArtifactCacheProxyTest' 2>&1 | grep -a "DIAG trace\|^[0-9]\+ \|DIAG cut\|Tests run:\|FAIL" || true
