name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'site/**'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build and test
        run: mvn package

      - name: Upload isx build
        uses: actions/upload-artifact@v6
        with:
          name: isx-quarkus-app
          path: cli/target/quarkus-app/
          retention-days: 1

      - name: Upload proxy build
        uses: actions/upload-artifact@v6
        with:
          name: isx-proxy-quarkus-app
          path: proxy/target/quarkus-app/
          retention-days: 1

  cancel-on-unit-failure:
    needs: [unit-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Cancel workflow run
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  build-native-cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build CLI native image
        run: mvn package -Dnative -DskipTests -pl cli -am

      - name: Upload CLI native binary
        uses: actions/upload-artifact@v6
        with:
          name: isx-native-cli
          path: cli/target/incus-spawn-*-runner
          retention-days: 1

  build-native-proxy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Oracle GraalVM 25.3
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build proxy native image
        run: mvn package -Dnative -DskipTests -pl proxy -am

      - name: Upload proxy native binary
        uses: actions/upload-artifact@v6
        with:
          name: isx-native-proxy
          path: proxy/target/incus-spawn-proxy-*-runner
          retention-days: 1

  build_appliance:
    uses: ./.github/workflows/build-appliance.yml

  integration-tests:
    needs: [unit-tests, build_appliance]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore appliance image
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: appliance/build/
          key: ${{ needs.build_appliance.outputs.cache_key_x86_64 }}
          fail-on-cache-miss: false

      - name: Download appliance artifact (fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v6
        with:
          name: appliance-x86_64
          path: appliance/build/

      - name: Create disk image from rootfs tarball
        run: |
          sudo apt-get install -y -qq btrfs-progs zstd
          truncate -s 4G appliance/build/disk.img
          LOOP=$(sudo losetup --find --show appliance/build/disk.img)
          sudo mkfs.btrfs -q -L isxroot "$LOOP"
          sudo mkdir -p /mnt/appliance
          sudo mount "$LOOP" /mnt/appliance
          zstd -d appliance/build/rootfs.tar.zst --stdout | sudo tar xf - -C /mnt/appliance
          sudo chmod 755 /mnt/appliance
          sudo umount /mnt/appliance
          sudo losetup -d "$LOOP"
          ls -lh appliance/build/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is available"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KVM not available — skipping VM-based tests"
          fi

      - name: Install QEMU
        if: steps.kvm.outputs.available == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86

      - name: Boot and test appliance VM
        if: steps.kvm.outputs.available == 'true'
        run: |
          timeout 120 qemu-system-x86_64 \
            -machine pc -enable-kvm -cpu host \
            -m 2G -nographic -no-reboot -nodefaults -serial stdio \
            -kernel appliance/build/vmlinuz \
            -drive file=appliance/build/disk.img,format=raw,if=virtio \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -append "root=/dev/vda rw console=ttyS0 mitigations=off isx.smoke_test=1" \
            > vm-console.log 2>&1 || true

          if grep -q 'ISX READY' vm-console.log; then
            echo "VM reached ISX READY"
          else
            echo "::error::VM did not reach ISX READY"
            tail -50 vm-console.log | sed 's/\x1b\[[0-9;]*m//g'
            exit 1
          fi

          if grep -q 'SMOKE TEST PASSED' vm-console.log; then
            echo "Incus smoke test passed"
          elif grep -q 'SMOKE TEST FAILED' vm-console.log; then
            echo "::error::Incus smoke test failed"
            grep 'SMOKE TEST' vm-console.log | sed 's/\x1b\[[0-9;]*m//g'
            exit 1
          else
            echo "::warning::Smoke test did not run (incus-spawn-vm-init may have failed)"
          fi

      - name: Upload console log
        if: always() && steps.kvm.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: vm-console-log
          path: vm-console.log
          retention-days: 7

  isx-integration-tests-jvm:
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Incus
        run: |
          curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/zabbly.gpg >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $codename main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq incus btrfs-progs qemu-system-x86
          sudo usermod -aG incus-admin "$USER"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Download isx build
        uses: actions/download-artifact@v6
        with:
          name: isx-quarkus-app
          path: quarkus-app/

      - name: Download proxy build
        uses: actions/download-artifact@v6
        with:
          name: isx-proxy-quarkus-app
          path: proxy-quarkus-app/

      - name: Install isx
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec java -jar %s/quarkus-app/quarkus-run.jar "$@"\n' "$PWD" \
            > "$HOME/.local/bin/isx"
          chmod +x "$HOME/.local/bin/isx"
          printf '#!/bin/sh\nexec java -jar %s/proxy-quarkus-app/quarkus-run.jar "$@"\n' "$PWD" \
            > "$HOME/.local/bin/isx-proxy"
          chmod +x "$HOME/.local/bin/isx-proxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize isx
        run: |
          sg incus-admin -c "isx init </dev/null"
          # isx init runs 'sudo incus admin init' which creates ~/.config/incus/
          # owned by root; fix so the incus CLI works for subsequent steps.
          sudo chown -R "$USER:$USER" ~/.config/incus/ 2>/dev/null || true
          # admin init creates a 'default' dir pool; isx init adds a 'cow' btrfs
          # pool but intentionally does not rewire the profile (isx doctor warns
          # instead). Point the profile at cow so templates use CoW branching.
          sg incus-admin -c "incus profile device set default root pool=cow"

      - name: Start MITM proxy
        run: |
          sed -i 's/apiKey: ""/apiKey: "sk-ant-placeholder-for-ci"/' \
              ~/.config/incus-spawn/config.yaml
          sg incus-admin -c "isx proxy start" &
          GATEWAY=$(sg incus-admin -c "incus network get incusbr0 ipv4.address" | cut -d/ -f1)
          echo "Waiting for proxy..."
          for i in $(seq 1 30); do
            if curl -sf "http://$GATEWAY:18080/health" >/dev/null 2>&1; then
              echo "Proxy ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Proxy did not become healthy within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create test templates
        run: |
          mkdir -p ~/.config/incus-spawn/images
          cat > ~/.config/incus-spawn/images/test-podman.yaml << 'EOF'
          name: tpl-test-podman
          parent: tpl-minimal
          tools:
            - podman
          EOF
          cat > ~/.config/incus-spawn/images/test-vm.yaml << 'EOF'
          name: tpl-test-vm
          parent: tpl-minimal
          type: vm
          EOF

      - name: Build templates
        run: |
          sg incus-admin -c "isx build tpl-minimal --yes"
          sg incus-admin -c "isx build tpl-test-podman --yes"
          sg incus-admin -c "isx build tpl-test-vm --yes"

      - name: Test CoW branching
        run: sg incus-admin -c "bash .github/scripts/test-cow-branching.sh"

      - name: Test container
        run: |
          sg incus-admin -c "isx branch test-container --from tpl-minimal --no-start"
          sg incus-admin -c "incus start test-container"
          echo "Waiting for container network..."
          sg incus-admin -c "incus exec test-container -- bash -c '
            systemctl start systemd-networkd 2>/dev/null
            for i in \$(seq 1 30); do
              ip -4 -o addr show eth0 | grep -q \"inet \" && break
              sleep 0.5
            done'"
          sg incus-admin -c "incus file push .github/scripts/test-instance.sh test-container/tmp/"
          sg incus-admin -c "incus exec test-container -- bash /tmp/test-instance.sh"

      - name: Test rootless podman
        run: |
          sg incus-admin -c "isx branch test-podman --from tpl-test-podman --no-start"
          sg incus-admin -c "incus start test-podman"
          echo "Waiting for container network..."
          sg incus-admin -c "incus exec test-podman -- bash -c '
            systemctl start systemd-networkd 2>/dev/null
            for i in \$(seq 1 30); do
              ip -4 -o addr show eth0 | grep -q \"inet \" && break
              sleep 0.5
            done'"
          sg incus-admin -c "incus file push .github/scripts/test-podman.sh test-podman/tmp/"
          sg incus-admin -c "incus exec test-podman -- bash /tmp/test-podman.sh"

      - name: Test VM
        run: |
          sg incus-admin -c "isx branch test-vm --from tpl-test-vm --no-start"
          sg incus-admin -c "incus start test-vm"
          echo "Waiting for VM agent..."
          for i in $(seq 1 60); do
            if sg incus-admin -c "incus exec test-vm -- true" 2>/dev/null; then
              echo "VM agent ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::VM agent did not become ready within 60s"
              exit 1
            fi
            sleep 1
          done
          sg incus-admin -c "incus file push .github/scripts/test-instance.sh test-vm/tmp/"
          sg incus-admin -c "incus exec test-vm -- bash /tmp/test-instance.sh"

      - name: Assert proxy survived
        run: |
          PROXY_PID=$(pgrep -nf 'isx-proxy|incus-spawn-proxy|proxy-quarkus-app' || true)
          if [ -z "$PROXY_PID" ]; then
            echo "::error::Proxy process is not running — it crashed during the test"
            exit 1
          fi
          echo "Proxy still running (PID $PROXY_PID)"

          if [ -f /proc/$PROXY_PID/status ]; then
            PEAK_RSS_KB=$(awk '/VmHWM/ {print $2}' /proc/$PROXY_PID/status)
            PEAK_RSS_MB=$((PEAK_RSS_KB / 1024))
            echo "Proxy peak RSS: ${PEAK_RSS_MB}MB (VmHWM: ${PEAK_RSS_KB}kB)"
          fi

      - name: Cleanup
        if: always()
        run: |
          sg incus-admin -c "isx destroy test-container" || true
          sg incus-admin -c "isx destroy test-podman" || true
          sg incus-admin -c "isx destroy test-vm" || true

  isx-integration-tests-native:
    needs: [build-native-cli, build-native-proxy]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Incus
        run: |
          curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/zabbly.gpg >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $codename main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq incus btrfs-progs qemu-system-x86
          sudo usermod -aG incus-admin "$USER"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download CLI native binary
        uses: actions/download-artifact@v6
        with:
          name: isx-native-cli
          path: native-cli/

      - name: Download proxy native binary
        uses: actions/download-artifact@v6
        with:
          name: isx-native-proxy
          path: native-proxy/

      - name: Install isx
        run: |
          mkdir -p "$HOME/.local/bin"
          install -m 755 native-cli/incus-spawn-*-runner "$HOME/.local/bin/isx"
          install -m 755 native-proxy/incus-spawn-proxy-*-runner "$HOME/.local/bin/isx-proxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialize isx
        run: |
          sg incus-admin -c "isx init </dev/null"
          # isx init runs 'sudo incus admin init' which creates ~/.config/incus/
          # owned by root; fix so the incus CLI works for subsequent steps.
          sudo chown -R "$USER:$USER" ~/.config/incus/ 2>/dev/null || true
          # admin init creates a 'default' dir pool; isx init adds a 'cow' btrfs
          # pool but intentionally does not rewire the profile (isx doctor warns
          # instead). Point the profile at cow so templates use CoW branching.
          sg incus-admin -c "incus profile device set default root pool=cow"

      - name: Start MITM proxy
        run: |
          sed -i 's/apiKey: ""/apiKey: "sk-ant-placeholder-for-ci"/' \
              ~/.config/incus-spawn/config.yaml
          sg incus-admin -c "isx proxy start" &
          GATEWAY=$(sg incus-admin -c "incus network get incusbr0 ipv4.address" | cut -d/ -f1)
          echo "Waiting for proxy..."
          for i in $(seq 1 30); do
            if curl -sf "http://$GATEWAY:18080/health" >/dev/null 2>&1; then
              echo "Proxy ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Proxy did not become healthy within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create test templates
        run: |
          mkdir -p ~/.config/incus-spawn/images
          cat > ~/.config/incus-spawn/images/test-podman.yaml << 'EOF'
          name: tpl-test-podman
          parent: tpl-minimal
          tools:
            - podman
          EOF
          cat > ~/.config/incus-spawn/images/test-vm.yaml << 'EOF'
          name: tpl-test-vm
          parent: tpl-minimal
          type: vm
          EOF

      - name: Build templates
        run: |
          sg incus-admin -c "isx build tpl-minimal --yes"
          sg incus-admin -c "isx build tpl-test-podman --yes"
          sg incus-admin -c "isx build tpl-test-vm --yes"

      - name: Test CoW branching
        run: sg incus-admin -c "bash .github/scripts/test-cow-branching.sh"

      - name: Test container
        run: |
          sg incus-admin -c "isx branch test-container --from tpl-minimal --no-start"
          sg incus-admin -c "incus start test-container"
          echo "Waiting for container network..."
          sg incus-admin -c "incus exec test-container -- bash -c '
            systemctl start systemd-networkd 2>/dev/null
            for i in \$(seq 1 30); do
              ip -4 -o addr show eth0 | grep -q \"inet \" && break
              sleep 0.5
            done'"
          sg incus-admin -c "incus file push .github/scripts/test-instance.sh test-container/tmp/"
          sg incus-admin -c "incus exec test-container -- bash /tmp/test-instance.sh"

      - name: Test rootless podman
        run: |
          sg incus-admin -c "isx branch test-podman --from tpl-test-podman --no-start"
          sg incus-admin -c "incus start test-podman"
          echo "Waiting for container network..."
          sg incus-admin -c "incus exec test-podman -- bash -c '
            systemctl start systemd-networkd 2>/dev/null
            for i in \$(seq 1 30); do
              ip -4 -o addr show eth0 | grep -q \"inet \" && break
              sleep 0.5
            done'"
          sg incus-admin -c "incus file push .github/scripts/test-podman.sh test-podman/tmp/"
          sg incus-admin -c "incus exec test-podman -- bash /tmp/test-podman.sh"

      - name: Test VM
        run: |
          sg incus-admin -c "isx branch test-vm --from tpl-test-vm --no-start"
          sg incus-admin -c "incus start test-vm"
          echo "Waiting for VM agent..."
          for i in $(seq 1 60); do
            if sg incus-admin -c "incus exec test-vm -- true" 2>/dev/null; then
              echo "VM agent ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::VM agent did not become ready within 60s"
              exit 1
            fi
            sleep 1
          done
          sg incus-admin -c "incus file push .github/scripts/test-instance.sh test-vm/tmp/"
          sg incus-admin -c "incus exec test-vm -- bash /tmp/test-instance.sh"

      - name: Assert proxy survived
        run: |
          PROXY_PID=$(pgrep -nf 'isx-proxy|incus-spawn-proxy' || true)
          if [ -z "$PROXY_PID" ]; then
            echo "::error::Proxy process is not running — it crashed during the test"
            exit 1
          fi
          echo "Proxy still running (PID $PROXY_PID)"

          if [ -f /proc/$PROXY_PID/status ]; then
            PEAK_RSS_KB=$(awk '/VmHWM/ {print $2}' /proc/$PROXY_PID/status)
            PEAK_RSS_MB=$((PEAK_RSS_KB / 1024))
            echo "Proxy peak RSS: ${PEAK_RSS_MB}MB (VmHWM: ${PEAK_RSS_KB}kB)"

            if [ "$PEAK_RSS_MB" -gt 200 ]; then
              echo "::warning::Proxy peak RSS (${PEAK_RSS_MB}MB) is approaching the 256MB MaxRAM ceiling"
            fi
          fi

      - name: Cleanup
        if: always()
        run: |
          sg incus-admin -c "isx destroy test-container" || true
          sg incus-admin -c "isx destroy test-podman" || true
          sg incus-admin -c "isx destroy test-vm" || true

  # Regression: isx init must produce a working setup on a machine where a pool exists but
  # the default profile is empty. This can happen when a pool was created manually (or by a
  # previous isx version) without 'incus admin init'. The isx-integration-tests jobs let
  # isx init handle everything from scratch, so they cannot catch this case.
  # A pool without a default profile made every instance creation fail with
  # "Failed getting root disk: No root device could be found", and was self-latching: once a
  # pool existed, init reported "Incus already initialized" and skipped the repair forever.
  fresh-daemon-init:
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Incus (deliberately WITHOUT 'incus admin init')
        run: |
          curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/zabbly.gpg >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $codename main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq incus btrfs-progs
          sudo usermod -aG incus-admin "$USER"

          # Create ONLY the storage pool — no admin init. This reproduces the reported broken
          # state exactly (pool present, default profile empty).
          sg incus-admin -c "incus storage create cow btrfs size=5GiB"

          echo "Default profile before isx init:"
          sg incus-admin -c "incus profile show default"

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Download isx build
        uses: actions/download-artifact@v6
        with:
          name: isx-quarkus-app
          path: quarkus-app/

      - name: Download proxy build
        uses: actions/download-artifact@v6
        with:
          name: isx-proxy-quarkus-app
          path: proxy-quarkus-app/

      - name: Install isx wrapper
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec java -jar %s/quarkus-app/quarkus-run.jar "$@"\n' "$PWD" \
            > "$HOME/.local/bin/isx"
          chmod +x "$HOME/.local/bin/isx"
          printf '#!/bin/sh\nexec java -jar %s/proxy-quarkus-app/quarkus-run.jar "$@"\n' "$PWD" \
            > "$HOME/.local/bin/isx-proxy"
          chmod +x "$HOME/.local/bin/isx-proxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run isx init
        run: sg incus-admin -c "isx init </dev/null"

      - name: Assert the default profile is usable
        run: |
          sg incus-admin -c "incus profile show default"

          # Match on device *type*, not the conventional names — a profile can be valid with
          # differently-named devices, and Incus only cares that a root disk exists.
          root_type=$(sg incus-admin -c \
            "incus query /1.0/profiles/default" | jq -r '[.devices[] | select(.type=="disk" and .path=="/")] | length')
          nic_count=$(sg incus-admin -c \
            "incus query /1.0/profiles/default" | jq -r '[.devices[] | select(.type=="nic")] | length')

          if [ "$root_type" -lt 1 ]; then
            echo "::error::isx init left the default profile without a root disk"
            exit 1
          fi
          if [ "$nic_count" -lt 1 ]; then
            echo "::error::isx init left the default profile without a NIC"
            exit 1
          fi
          echo "Default profile has a root disk and a NIC."

      - name: Assert an instance can actually be created
        run: |
          # The real assertion: a profile that merely looks right can still name a bad pool.
          # This is the exact operation that failed with "No root device could be found".
          # Rolling alias on purpose: a pinned version silently EOLs off the image server and
          # the job then fails on image resolution rather than on what it means to test.
          sg incus-admin -c "incus launch images:alpine/edge fresh-daemon-smoketest"
          sg incus-admin -c "incus list fresh-daemon-smoketest"

      - name: Cleanup
        if: always()
        run: sg incus-admin -c "incus delete -f fresh-daemon-smoketest" || true
