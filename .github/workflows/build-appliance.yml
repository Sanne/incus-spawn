name: Build Appliance Image

on:
  push:
    paths:
      - 'appliance/**'
    branches: [main]
  pull_request:
    paths:
      - 'appliance/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version tag to embed in the appliance (e.g. v0.3.7 — the v prefix is stripped). Defaults to Maven project.version.'
        required: false
        type: string
    outputs:
      cache_key_x86_64:
        description: Cache key for x86_64 appliance image
        value: ${{ jobs.build_x86_64.outputs.cache_key }}
      cache_key_aarch64:
        description: Cache key for aarch64 appliance image
        value: ${{ jobs.build_aarch64.outputs.cache_key }}

jobs:
  build_x86_64:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.cache_key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute cache key
        id: cache_key
        run: echo "key=appliance-x86_64-${INPUT_VERSION:-dev}-${{ hashFiles('appliance/**') }}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Restore cached image
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: appliance/build/
          key: ${{ steps.cache_key.outputs.key }}

      - name: Extract kernel version
        if: steps.cache.outputs.cache-hit != 'true'
        id: kernel
        run: |
          ver=$(grep '^KERNEL_VERSION=' appliance/kernel/build-kernel.sh | head -1 | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Restore cached kernel source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/kernel-cache/
          key: kernel-source-${{ steps.kernel.outputs.version }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman zstd btrfs-progs build-essential flex bison bc libelf-dev libssl-dev

      - name: Build appliance image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${INPUT_VERSION#v}"
          sudo env KERNEL_CACHE_DIR=/tmp/kernel-cache ${VER:+ISX_VERSION=$VER} appliance/build.sh appliance/build
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Cache kernel source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/kernel-cache/
          key: kernel-source-${{ steps.kernel.outputs.version }}

      - name: Report image size
        run: ls -lh appliance/build/

      - name: Verify embedded version
        if: inputs.version != ''
        run: |
          EXPECTED="${INPUT_VERSION#v}"
          ACTUAL=$(zstd -d appliance/build/rootfs.tar.zst --stdout | tar xf - --to-stdout ./etc/isx-version 2>/dev/null || echo "NOT FOUND")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Appliance version mismatch: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "Appliance version verified: $ACTUAL"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Cache built image
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: appliance/build/
          key: ${{ steps.cache_key.outputs.key }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v6
        with:
          name: appliance-x86_64
          path: appliance/build/
          retention-days: 30

  build_aarch64:
    runs-on: ubuntu-24.04-arm
    outputs:
      cache_key: ${{ steps.cache_key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute cache key
        id: cache_key
        run: echo "key=appliance-aarch64-${INPUT_VERSION:-dev}-${{ hashFiles('appliance/**') }}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Restore cached image
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: appliance/build/
          key: ${{ steps.cache_key.outputs.key }}

      - name: Extract kernel version
        if: steps.cache.outputs.cache-hit != 'true'
        id: kernel
        run: |
          ver=$(grep '^KERNEL_VERSION=' appliance/kernel/build-kernel.sh | head -1 | cut -d'"' -f2)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Restore cached kernel source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/kernel-cache/
          key: kernel-source-${{ steps.kernel.outputs.version }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman zstd btrfs-progs build-essential flex bison bc libelf-dev libssl-dev
          sudo mkdir -p /etc/containers
          printf '[engine]\nlock_type = "file"\n' | sudo tee /etc/containers/containers.conf >/dev/null

      - name: Build appliance image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VER="${INPUT_VERSION#v}"
          sudo env KERNEL_CACHE_DIR=/tmp/kernel-cache ${VER:+ISX_VERSION=$VER} appliance/build.sh appliance/build
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Cache kernel source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /tmp/kernel-cache/
          key: kernel-source-${{ steps.kernel.outputs.version }}

      - name: Report image size
        run: ls -lh appliance/build/

      - name: Verify embedded version
        if: inputs.version != ''
        run: |
          EXPECTED="${INPUT_VERSION#v}"
          ACTUAL=$(zstd -d appliance/build/rootfs.tar.zst --stdout | tar xf - --to-stdout ./etc/isx-version 2>/dev/null || echo "NOT FOUND")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Appliance version mismatch: expected '$EXPECTED', got '$ACTUAL'"
            exit 1
          fi
          echo "Appliance version verified: $ACTUAL"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Cache built image
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: appliance/build/
          key: ${{ steps.cache_key.outputs.key }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v6
        with:
          name: appliance-aarch64
          path: appliance/build/
          retention-days: 30
