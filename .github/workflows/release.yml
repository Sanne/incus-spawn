name: Release

on:
  push:
    tags:
      - 'v*'
  # The profiles and build jobs alone, on a branch, to check a change to how the binaries are
  # built before a tag does (docs/dev/PGO.md, "Verification before merging"). Nothing is published:
  # appliance, channel and release run for a pushed tag only.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appliance:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build-appliance.yml
    with:
      version: ${{ github.ref_name }}

  channel:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    outputs:
      is_dev: ${{ steps.detect.outputs.is_dev }}
      homebrew_formula: ${{ steps.detect.outputs.homebrew_formula }}
      copr_project: ${{ steps.detect.outputs.copr_project }}
      apt_suite: ${{ steps.detect.outputs.apt_suite }}
    steps:
      - name: Detect release channel from tag
        id: detect
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ -dev\. ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
            echo "homebrew_formula=incus-spawn-dev.rb" >> "$GITHUB_OUTPUT"
            echo "copr_project=isx-dev" >> "$GITHUB_OUTPUT"
            echo "apt_suite=dev" >> "$GITHUB_OUTPUT"
            echo "Dev release detected: $TAG"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "homebrew_formula=incus-spawn.rb" >> "$GITHUB_OUTPUT"
            echo "copr_project=incus-spawn" >> "$GITHUB_OUTPUT"
            echo "apt_suite=stable" >> "$GITHUB_OUTPUT"
            echo "Stable release detected: $TAG"
          fi

  # PGO profiles for this exact commit (docs/dev/PGO.md): instrumented builds of both binaries
  # run the bench/ workloads against a real Incus, and the per-process dumps are merged into one
  # profile per binary. Collected on Linux amd64 and applied on every platform that builds with
  # the same GraalVM. Nothing is kept between releases, and a failed collection fails the release:
  # there is no older profile to fall back on.
  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Pinned: the load generator runs in this job, so a moved tag would change what it runs.
      HYPERFOIL_IMAGE: quay.io/hyperfoil/hyperfoil@sha256:caf92d80a32d81f531ef8adc1cf17e143b11c22199f0d8174d8c6bdb5dd7a918
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch $GITHUB_REF_NAME https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same GraalVM as the builds that apply the profiles: a profile's version must match.
      - name: Install Oracle GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.5'
          java-version: '25'
          distribution: 'graalvm'

      - name: Set version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=0.0.0-dispatch.$GITHUB_RUN_NUMBER; fi
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false -DprocessAllModules=true

      # As isx-integration-tests-native in test-integration.yml prepares it.
      - name: Install Incus
        run: |
          set -o pipefail  # a failed key download must fail here, not as a later NO_PUBKEY
          curl -fsSL https://pkgs.zabbly.com/key.asc | gpg --dearmor \
            | sudo tee /etc/apt/keyrings/zabbly.gpg >/dev/null
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.gpg] https://pkgs.zabbly.com/incus/stable $codename main" \
            | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo .github/scripts/apt-install.sh incus btrfs-progs
          sudo usermod -aG incus-admin "$USER"

      - name: Build instrumented binaries
        run: |
          mvn package -Dnative -DskipTests -Dnative.pgo.instrument
          mkdir -p "$HOME/.local/bin"
          install -m 755 cli/target/incus-spawn-*-runner "$HOME/.local/bin/isx"
          install -m 755 proxy/target/incus-spawn-proxy-*-runner "$HOME/.local/bin/isx-proxy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # In a scratch directory: an instrumented process given no -XX:ProfilesDumpFile writes
      # default.iprof where it runs, and these runs are no workload's.
      - name: Initialize isx
        working-directory: ${{ runner.temp }}
        run: |
          sg incus-admin -c "isx init </dev/null"
          sudo chown -R "$USER:$USER" ~/.config/incus/ 2>/dev/null || true
          sg incus-admin -c "incus profile device set default root pool=cow"

      # A fresh identity, not sg: sudo -u gives the user its groups as a login would (incus-admin from
      # the usermod above) and keeps its own primary group. sg makes incus-admin the primary group,
      # and the model loads' rootless podman then fails ("newuidmap: Target process ... is owned by a
      # different user"). PATH is passed on because sudo resets it.
      - name: Collect profiles
        run: |
          sudo --preserve-env -u "$USER" env PATH="$PATH" \
            bench/pgo-collect.sh --proxy=$HOME/.local/bin/isx-proxy --cli=$HOME/.local/bin/isx --out=$RUNNER_TEMP/pgo-raw

      # About 7 minutes when it works; a merge that stalls fails here instead of using up the job
      - name: Merge profiles
        timeout-minutes: 25
        run: |
          scripts/pgo-merge.sh cli "$RUNNER_TEMP/pgo-raw/cli" pgo
          scripts/pgo-merge.sh proxy "$RUNNER_TEMP/pgo-raw/proxy" pgo
          # The commit they were collected from: a build of any other refuses them
          git rev-parse HEAD > pgo/commit
          ls -l pgo

      # Kept for a local build to fetch: mvn package -Dnative -Dnative.pgo=<the unpacked directory>
      - name: Upload profiles
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: pgo-profiles
          path: |
            pgo/cli.iprof.gz
            pgo/proxy.iprof.gz
            pgo/commit
          retention-days: 90
          if-no-files-found: error

  build:
    needs: [profiles]
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            os: linux
            arch: amd64
            graalvm-version: '25.5'
            pgo: true
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            graalvm-version: '25.5'
            pgo: true
          - runner: macos-15
            os: macos
            arch: aarch64
            graalvm-version: '25.5'
            pgo: true
          # No Intel macOS build since Quarkus 4 (#1693): it needs GraalVM 25.0.4, and Oracle GraalVM
          # ships no macOS x64 build after 25.0.1. design/native-image.md "Intel Macs are not shipped".
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # -Dnative.pgo=<dir> applies <dir>/cli.iprof.gz and <dir>/proxy.iprof.gz (cli/pom.xml, proxy/pom.xml)
      PGO_ARGS: ${{ matrix.pgo && format('-Dnative.pgo={0}/pgo', github.workspace) || '' }}
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch $GITHUB_REF_NAME https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Oracle GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ matrix.graalvm-version }}
          java-version: '25'
          distribution: 'graalvm'

      - name: Set version from tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=0.0.0-dispatch.$GITHUB_RUN_NUMBER; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Download PGO profiles
        if: matrix.pgo
        uses: actions/download-artifact@v6
        with:
          name: pgo-profiles
          path: pgo

      # Each job clones the ref afresh, so a branch pushed to (or a tag moved) during the run
      # would otherwise build one commit with another's profile.
      - name: Check the profiles are this commit's
        if: matrix.pgo
        run: |
          [ "$(cat pgo/commit)" = "$(git rev-parse HEAD)" ] \
            || { echo "::error::the profiles are of $(cat pgo/commit), this build is of $(git rev-parse HEAD)"; exit 1; }

      # Both uber-jars: the JBang catalog installs `isx` and `isx-proxy` as separate aliases, and
      # an installation with only the CLI cannot run the proxy at all (see jbang-catalog.json).
      - name: Build uber-jar
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          mvn package -Prelease -DskipTests
          mkdir -p dist-jars
          cp cli/target/incus-spawn-*-runner.jar dist-jars/incus-spawn-runner.jar
          cp proxy/target/incus-spawn-proxy-*-runner.jar dist-jars/isx-proxy-runner.jar

      # A released jar takes the role of the OS it runs on: its Platform is the one this build
      # compiled, not the macOS-role test build's, and -Dos.name cannot change its role (#1800)
      - name: Check uber-jars' platform role
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: scripts/check-platform-role.sh dist-jars/incus-spawn-runner.jar dist-jars/isx-proxy-runner.jar

      - name: Build native image (Linux)
        if: matrix.os == 'linux'
        run: |
          set -o pipefail  # tee must not hide a failed build
          mvn package -Dnative -DskipTests $PGO_ARGS | tee native-build.log
          mkdir -p dist
          cp cli/target/incus-spawn-*-runner dist/incus-spawn-linux-${{ matrix.arch }}
          cp proxy/target/incus-spawn-proxy-*-runner dist/isx-proxy-linux-${{ matrix.arch }}

      - name: Build native image (macOS)
        if: matrix.os == 'macos'
        run: |
          set -o pipefail  # tee must not hide a failed build
          mvn package -Dnative -DskipTests $PGO_ARGS -Dmacos.info.plist="$(pwd)/cli/src/main/resources/Info.plist" | tee native-build.log
          mkdir -p dist
          cp cli/target/incus-spawn-*-runner dist/incus-spawn-macos-${{ matrix.arch }}
          cp proxy/target/incus-spawn-proxy-*-runner dist/isx-proxy-macos-${{ matrix.arch }}

      # Both binaries must have been built with the profile, and found most of it relevant: a
      # profile that does not fit this platform's image would make the code PGO chose fast slow.
      - name: Check PGO profile quality
        if: matrix.pgo
        run: .github/scripts/check-pgo-quality.sh native-build.log

      - name: Smoke-test native binaries
        run: |
          CLI=dist/incus-spawn-${{ matrix.os }}-${{ matrix.arch }}
          PROXY=dist/isx-proxy-${{ matrix.os }}-${{ matrix.arch }}
          chmod +x "$CLI" "$PROXY"

          # --version: must exit 0 and contain the expected version string
          VERSION_OUTPUT=$("$CLI" --version)
          echo "$VERSION_OUTPUT"
          echo "$VERSION_OUTPUT" | grep -qF "$VERSION"

          # --help: must exit 0
          "$CLI" --help > /dev/null

          # Shell completions: must exit 0 with non-empty output
          for shell in bash zsh fish; do
            OUTPUT=$("$CLI" completion "$shell")
            if [ -z "$OUTPUT" ]; then
              echo "::error::completion $shell produced empty output"
              exit 1
            fi
          done

          # Proxy --help: must exit 0
          "$PROXY" --help > /dev/null

          # templates list: exercises YAML resource bundling and definition parsing
          TEMPLATES_OUTPUT=$("$CLI" templates list)
          echo "$TEMPLATES_OUTPUT"
          echo "$TEMPLATES_OUTPUT" | grep -q "tpl-minimal"

          echo "Smoke tests passed for ${{ matrix.os }}-${{ matrix.arch }}"

      # The sums the release publishes for these files are the ones recorded here, by the job that
      # built them; the release job checks its copies still match before it publishes them (#2080).
      - name: Record checksums
        run: |
          sums() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          (cd dist && sums -- incus-spawn-* isx-proxy-* > SHA256SUMS && cat SHA256SUMS)
          if [ -d dist-jars ]; then (cd dist-jars && sums -- *.jar > SHA256SUMS && cat SHA256SUMS); fi

      # The runner is discarded after the job, so the smoke may change its System keychain (#1467)
      - name: Keychain trust smoke (macOS)
        if: matrix.os == 'macos'
        run: .github/scripts/macos-keychain-smoke.sh dist/incus-spawn-macos-${{ matrix.arch }}

      - name: Upload uber-jar
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: uber-jar
          path: dist-jars/

      - name: Upload native binary (Linux)
        if: matrix.os == 'linux'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: native-linux-${{ matrix.arch }}
          path: dist/

      - name: Upload native binary (macOS)
        if: matrix.os == 'macos'
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: native-macos-${{ matrix.arch }}
          path: dist/

  # A dispatch never runs the release job, so this writes the SHA256SUMS of the binaries it built with
  # the release job's script, each checked against the sums its build job recorded (#2080).
  checksums:
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch $GITHUB_REF_NAME https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Write SHA256SUMS
        run: |
          .github/scripts/release-sha256sums.sh SHA256SUMS \
            artifacts/uber-jar/*.jar artifacts/native-*/incus-spawn-* artifacts/native-*/isx-proxy-*
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: SHA256SUMS
          path: SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, appliance, channel]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        run: git clone --depth 1 --branch $GITHUB_REF_NAME https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare appliance artifacts
        run: |
          for arch in x86_64 aarch64; do
            dir="artifacts/appliance-${arch}"
            if [ -d "$dir" ]; then
              # Ship the kernel compressed. aarch64 has no self-decompressing
              # kernel target -- its Image is raw, ~11 MB -- so without this the
              # macOS download is more than twice the size it needs to be. isx
              # gunzips it on the way to ~/.isx (VmManager.downloadKernel).
              gzip -9 -c "$dir/vmlinuz" > "artifacts/vmlinuz-${arch}.gz"
              cp "$dir/disk.img.gz" "artifacts/disk-${arch}.img.gz"
            fi
          done

      - name: Generate shell completions
        run: |
          chmod +x artifacts/native-linux-amd64/incus-spawn-linux-amd64
          COMPLETIONS_DIR=$(mktemp -d)
          artifacts/native-linux-amd64/incus-spawn-linux-amd64 completion bash > "$COMPLETIONS_DIR/isx.bash"
          artifacts/native-linux-amd64/incus-spawn-linux-amd64 completion zsh  > "$COMPLETIONS_DIR/_isx"
          artifacts/native-linux-amd64/incus-spawn-linux-amd64 completion fish > "$COMPLETIONS_DIR/isx.fish"
          for f in "$COMPLETIONS_DIR"/*; do
            if [ ! -s "$f" ]; then
              echo "::error::Shell completion file $f is empty"
              exit 1
            fi
          done
          tar -czf artifacts/completions.tar.gz -C "$COMPLETIONS_DIR" isx.bash _isx isx.fish

      # Every macOS binary gh release create uploads below, so nothing ships that needs another
      # macOS than pom.xml's macos.deployment.target (#1086).
      - name: Check macOS binaries' minimum macOS
        run: scripts/check-macos-minos.py artifacts/native-macos-*/*-macos-*

      # One list feeds both the SHA256SUMS and the upload, so every asset is in the sums get-isx.sh
      # checks its downloads against (#2080).
      - name: Create GitHub Release
        run: |
          set -- \
            artifacts/uber-jar/incus-spawn-runner.jar \
            artifacts/uber-jar/isx-proxy-runner.jar \
            artifacts/native-linux-amd64/incus-spawn-linux-amd64 \
            artifacts/native-linux-aarch64/incus-spawn-linux-aarch64 \
            artifacts/native-macos-aarch64/incus-spawn-macos-aarch64 \
            artifacts/native-linux-amd64/isx-proxy-linux-amd64 \
            artifacts/native-linux-aarch64/isx-proxy-linux-aarch64 \
            artifacts/native-macos-aarch64/isx-proxy-macos-aarch64 \
            artifacts/vmlinuz-x86_64.gz \
            artifacts/vmlinuz-aarch64.gz \
            artifacts/disk-x86_64.img.gz \
            artifacts/disk-aarch64.img.gz \
            artifacts/completions.tar.gz \
            common/src/main/resources/git-remote-isx
          .github/scripts/release-sha256sums.sh SHA256SUMS "$@"
          cat SHA256SUMS
          gh release create $GITHUB_REF_NAME "$@" SHA256SUMS \
            ${{ needs.channel.outputs.is_dev == 'true' && '--prerelease' || '' }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        continue-on-error: true
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          SHA_ARM64=$(sha256sum artifacts/native-macos-aarch64/incus-spawn-macos-aarch64 | cut -d' ' -f1)
          PROXY_SHA_ARM64=$(sha256sum artifacts/native-macos-aarch64/isx-proxy-macos-aarch64 | cut -d' ' -f1)
          GIT_REMOTE_SHA=$(sha256sum common/src/main/resources/git-remote-isx | cut -d' ' -f1)
          COMPLETIONS_SHA=$(sha256sum artifacts/completions.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${TAP_TOKEN}@github.com/Sanne/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          FORMULA="Formula/${{ needs.channel.outputs.homebrew_formula }}"

          # No Intel macOS binary is released any more (#1693). Rewritten, a formula that still names
          # one would point Intel Macs at a missing v#{version} binary beside the previous isx-proxy.
          # The tap's formulas must declare depends_on arch: :arm64 instead, which brew reports to an
          # Intel Mac before downloading. A refusal leaves every Mac on the previous formula: this step
          # is continue-on-error, so the release still publishes, with this annotation.
          if grep -q 'macos-x86_64\|on_intel\|depends_on arch: :x86_64' "$FORMULA" || ! grep -q '^  depends_on arch: :arm64' "$FORMULA"; then
            echo "::error::$FORMULA still serves Intel Macs: make it Apple Silicon only (depends_on arch: :arm64, no x86_64 asset) before this release updates it"
            exit 1
          fi

          # Add isx-proxy resource and install blocks if not yet present (handles
          # the transition from monolithic CLI to separate proxy binary)
          if ! grep -q 'resource "isx-proxy"' "$FORMULA"; then
            awk -v ver="$VERSION" -v sha_arm="$PROXY_SHA_ARM64" '
              /resource "git-remote-isx"/ {
                print "  resource \"isx-proxy\" do"
                print "    url \"https://github.com/Sanne/incus-spawn/releases/download/v" ver "/isx-proxy-macos-aarch64\""
                print "    sha256 \"" sha_arm "\""
                print "  end"
                print ""
              }
              /resource\("git-remote-isx"\)/ {
                print "    resource(\"isx-proxy\").stage do"
                print "      bin.install \"isx-proxy-macos-aarch64\" => \"isx-proxy\""
                print "    end"
                print ""
              }
              {print}
            ' "$FORMULA" > "${FORMULA}.tmp" && mv "${FORMULA}.tmp" "$FORMULA"
          fi

          # Homebrew's name for pom.xml's macos.deployment.target, which the binaries were
          # checked against above; WorkflowRunnerLabelsTest keeps the two equal. Rewritten
          # every release, ahead of the first depends_on as `brew style` orders it.
          MACOS_MIN=sequoia
          awk -v min="$MACOS_MIN" '
            /^  depends_on macos:/ {next}
            /^  depends_on / && !done {print "  depends_on macos: :" min; done=1}
            {print}
            END {exit !done}
          ' "$FORMULA" > "${FORMULA}.tmp" \
            || { echo "::error::no depends_on line in $FORMULA to place the macOS minimum before"; exit 1; }
          mv "${FORMULA}.tmp" "$FORMULA"

          sed -i \
            -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
            -e "/incus-spawn-macos-aarch64/,/sha256/{s|/v[0-9][^/]*/|/v${VERSION}/|; s/sha256 \"[^\"]*\"/sha256 \"${SHA_ARM64}\"/;}" \
            -e "/isx-proxy-macos-aarch64/,/sha256/{s|/v[0-9][^/]*/|/v${VERSION}/|; s/sha256 \"[^\"]*\"/sha256 \"${PROXY_SHA_ARM64}\"/;}" \
            -e "/resource \"git-remote-isx\"/,/end/{s|url \"[^\"]*\"|url \"https://github.com/Sanne/incus-spawn/releases/download/v${VERSION}/git-remote-isx\"|}" \
            -e "/resource \"git-remote-isx\"/,/end/{s/sha256 \"[^\"]*\"/sha256 \"${GIT_REMOTE_SHA}\"/}" \
            -e "/resource \"completions\"/,/end/{s|url \"[^\"]*\"|url \"https://github.com/Sanne/incus-spawn/releases/download/v${VERSION}/completions.tar.gz\"|}" \
            -e "/resource \"completions\"/,/end/{s/sha256 \"[^\"]*\"/sha256 \"${COMPLETIONS_SHA}\"/}" \
            "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          FORMULA_NAME="${{ needs.channel.outputs.homebrew_formula }}"
          git commit -m "Update ${FORMULA_NAME%.rb} to ${VERSION}"
          git push
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Publish to COPR
        continue-on-error: true
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sudo .github/scripts/apt-install.sh rpm
          pip install --quiet copr-cli
          mkdir -p ~/.config
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_LOGIN" "$COPR_USERNAME" "$COPR_TOKEN" > ~/.config/copr
          RPM_VERSION="${VERSION//-dev./~dev.}"
          CHANGELOG="* $(date +'%a %b %d %Y') Sanne Grinovero <sanne@hibernate.org> - ${RPM_VERSION}-1\n- See https://github.com/Sanne/incus-spawn/releases/tag/v${VERSION}"
          sed -e "s/@VERSION@/$RPM_VERSION/g" -e "s|@CHANGELOG@|$CHANGELOG|g" packaging/incus-spawn.spec > /tmp/incus-spawn.spec
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          cp artifacts/native-linux-amd64/incus-spawn-linux-amd64 ~/rpmbuild/SOURCES/
          cp artifacts/native-linux-aarch64/incus-spawn-linux-aarch64 ~/rpmbuild/SOURCES/
          cp artifacts/native-linux-amd64/isx-proxy-linux-amd64 ~/rpmbuild/SOURCES/
          cp artifacts/native-linux-aarch64/isx-proxy-linux-aarch64 ~/rpmbuild/SOURCES/
          cp common/src/main/resources/git-remote-isx ~/rpmbuild/SOURCES/
          cp /tmp/incus-spawn.spec ~/rpmbuild/SPECS/
          rpmbuild -bs ~/rpmbuild/SPECS/incus-spawn.spec
          copr-cli build ${{ needs.channel.outputs.copr_project }} ~/rpmbuild/SRPMS/incus-spawn-*.src.rpm
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}

      - name: Publish to APT repository
        continue-on-error: true
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          if [ -z "$APT_GPG_PRIVATE_KEY" ] || [ -z "$APT_REPO_TOKEN" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY or APT_REPO_TOKEN secret is not set — skipping APT repository publish"
            exit 0
          fi

          sudo .github/scripts/apt-install.sh dpkg-dev apt-utils

          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^sec:/{print $5; exit}')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "::error::Failed to extract GPG key ID after import — check APT_GPG_PRIVATE_KEY secret"
            exit 1
          fi
          echo "Using GPG key: $GPG_KEY_ID"

          # Extract pre-generated shell completions
          COMPLETIONS_DIR=$(mktemp -d)
          tar -xzf artifacts/completions.tar.gz -C "$COMPLETIONS_DIR"

          # Convert -dev.N to ~dev.N for Debian versioning (~ sorts lower, correct pre-release ordering)
          DEB_VERSION="${VERSION//-dev./~dev.}"

          # Build .deb for each architecture
          for arch_pair in "amd64:amd64" "aarch64:arm64"; do
            BUILD_ARCH=${arch_pair%%:*}
            DEB_ARCH=${arch_pair##*:}
            PKG_DIR="/tmp/incus-spawn_${DEB_VERSION}_${DEB_ARCH}"

            mkdir -p "$PKG_DIR/DEBIAN"
            mkdir -p "$PKG_DIR/usr/bin"
            mkdir -p "$PKG_DIR/usr/share/bash-completion/completions"
            mkdir -p "$PKG_DIR/usr/share/zsh/vendor-completions"
            mkdir -p "$PKG_DIR/usr/share/fish/vendor_completions.d"

            sed -e "s/@VERSION@/$DEB_VERSION/" -e "s/@ARCH@/$DEB_ARCH/" \
              packaging/debian/control > "$PKG_DIR/DEBIAN/control"
            install -m 755 packaging/debian/prerm "$PKG_DIR/DEBIAN/prerm"

            install -m 755 "artifacts/native-linux-${BUILD_ARCH}/incus-spawn-linux-${BUILD_ARCH}" "$PKG_DIR/usr/bin/isx"
            install -m 755 "artifacts/native-linux-${BUILD_ARCH}/isx-proxy-linux-${BUILD_ARCH}" "$PKG_DIR/usr/bin/isx-proxy"
            install -m 755 common/src/main/resources/git-remote-isx "$PKG_DIR/usr/bin/git-remote-isx"
            install -m 644 "$COMPLETIONS_DIR/isx.bash" "$PKG_DIR/usr/share/bash-completion/completions/isx"
            install -m 644 "$COMPLETIONS_DIR/_isx" "$PKG_DIR/usr/share/zsh/vendor-completions/_isx"
            install -m 644 "$COMPLETIONS_DIR/isx.fish" "$PKG_DIR/usr/share/fish/vendor_completions.d/isx.fish"

            dpkg-deb --root-owner-group --build "$PKG_DIR"
            echo "Built: $(basename "$PKG_DIR").deb ($(du -h "$PKG_DIR.deb" | cut -f1))"
          done

          # Clone the APT repository
          APT_REPO="Sanne/isx-apt-releases"
          APT_REPO_URL="https://x-access-token:${APT_REPO_TOKEN}@github.com/${APT_REPO}.git"
          APT_DIR="/tmp/apt-repo"
          git clone --depth 1 "$APT_REPO_URL" "$APT_DIR"

          gpg --export --armor "$GPG_KEY_ID" > "$APT_DIR/public.gpg"

          # Copy debs into channel-specific pool, removing old versions
          APT_SUITE="${{ needs.channel.outputs.apt_suite }}"
          mkdir -p "$APT_DIR/pool/${APT_SUITE}"
          rm -f "$APT_DIR"/pool/${APT_SUITE}/incus-spawn_*.deb
          cp /tmp/incus-spawn_${DEB_VERSION}_*.deb "$APT_DIR/pool/${APT_SUITE}/"

          # Generate Packages indices
          cd "$APT_DIR"
          for deb_arch in amd64 arm64; do
            mkdir -p "dists/${APT_SUITE}/main/binary-${deb_arch}"
            dpkg-scanpackages --arch "$deb_arch" "pool/${APT_SUITE}" 2>/dev/null > "dists/${APT_SUITE}/main/binary-${deb_arch}/Packages"
            gzip -9c "dists/${APT_SUITE}/main/binary-${deb_arch}/Packages" > "dists/${APT_SUITE}/main/binary-${deb_arch}/Packages.gz"
          done

          # Generate and sign Release file
          cd "$APT_DIR/dists/$APT_SUITE"
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="incus-spawn" \
            -o APT::FTPArchive::Release::Label="incus-spawn" \
            -o APT::FTPArchive::Release::Suite="$APT_SUITE" \
            -o APT::FTPArchive::Release::Codename="$APT_SUITE" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

          # Commit and push
          cd "$APT_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APT repository for v${VERSION}"
          git push
          echo "APT repository published to https://sanne.github.io/isx-apt-releases/"
        env:
          APT_REPO_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

      # Disabled: automated PRs to NixOS/nixpkgs need maintainer alignment first.
