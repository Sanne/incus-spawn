name: macOS Keychain trust (native)

# The native binaries are built on macOS only by release.yml, so a native-only break in how isx
# reads the Keychain's trust settings (#1467), or refuses a chain it denies (#1552), would otherwise
# surface at release time. This builds the CLI and the proxy weekly, on a change to that code, and
# by hand, and runs the Keychain smoke against both. It also runs KeychainTrustMacTest, which
# unit-tests-macos runs only on GitHub's runners, never on the project's Mac runner (#2298).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'common/src/main/java/dev/incusspawn/util/MacKeychainTrust.java'
      - 'common/src/main/java/dev/incusspawn/util/SystemTrust.java'
      - 'common/src/main/java/dev/incusspawn/util/DeniedChainTrustManager.java'
      - 'common/src/test/java/dev/incusspawn/util/KeychainTrustMacTest.java'
      # KeychainTrustMacTest also tests collectTrustAnchors(), and the Mac runner skips it (#2298)
      - 'common/src/main/java/dev/incusspawn/proxy/CertificateAuthority.java'
      # The proxy's upstream trust, which the smoke's handshake goes through (#1631)
      - 'proxy/src/main/java/dev/incusspawn/proxy/Upstream.java'
      # What the smoke reads the result through
      - 'cli/src/main/java/dev/incusspawn/command/DoctorCommand.java'
      - 'cli/src/main/java/dev/incusspawn/command/UpdateBaseCommand.java'
      - 'cli/src/main/java/dev/incusspawn/baseimage/BaseImageReleases.java'
      # How the proxy finds the made-up lease and listens without a VM
      - 'common/src/main/java/dev/incusspawn/vm/VmNetwork.java'
      - 'proxy/src/main/java/dev/incusspawn/proxy/ProxyMain.java'
      - '.github/scripts/macos-keychain-smoke.sh'
      - '.github/workflows/macos-keychain-trust.yml'

permissions:
  contents: read

concurrency:
  group: macos-keychain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-keychain-smoke:
    # A GitHub-hosted runner is discarded after the job, so the smoke may change its System keychain
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Oracle GraalVM 25.5
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          version: '25.5'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        id: maven-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: macos-maven-native-keychain-smoke-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            macos-maven-native-keychain-smoke-

      - name: Build CLI and proxy native images
        run: .github/scripts/mvn-ci.sh '${{ steps.maven-cache.outputs.cache-hit }}' -B -ntp package -Dnative -DskipTests -Dnative.optimization=-Ob -pl cli,proxy -am

      - name: Keychain trust smoke
        run: .github/scripts/macos-keychain-smoke.sh cli/target/incus-spawn-*-runner proxy/target/incus-spawn-proxy-*-runner

      # Changes the System keychain's trust settings, which only a discarded runner may do (#1467).
      # unit-tests-macos skips it on the project's Mac runner, so every change to the Keychain code
      # still runs it here (#2298). It needs no native image, so a failed build or smoke does not hide it.
      - name: KeychainTrustMacTest
        if: ${{ !cancelled() }}
        run: .github/scripts/mvn-ci.sh '${{ steps.maven-cache.outputs.cache-hit }}' -B -ntp -pl common test -Dtest=KeychainTrustMacTest
        env:
          ISX_TEST_MUTATE_SYSTEM_KEYCHAIN: '1'
