name: macOS Keychain trust (native)

# The native CLI is built on macOS only by release.yml, so a native-only break in how isx reads
# the Keychain's trust settings (#1467) would otherwise surface at release time. This builds it
# weekly, on a change to that code, and by hand, and runs the Keychain smoke against it.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'common/src/main/java/dev/incusspawn/util/MacKeychainTrust.java'
      - 'common/src/main/java/dev/incusspawn/util/SystemTrust.java'
      - 'common/src/main/java/dev/incusspawn/util/DeniedChainTrustManager.java'
      # The proxy's upstream trust; the smoke builds the CLI alone, so it checks only the classes both share (#1631)
      - 'proxy/src/main/java/dev/incusspawn/proxy/Upstream.java'
      # What the smoke reads the result through
      - 'cli/src/main/java/dev/incusspawn/command/DoctorCommand.java'
      - '.github/scripts/macos-keychain-smoke.sh'
      - '.github/workflows/macos-keychain-trust.yml'

permissions:
  contents: read

concurrency:
  group: macos-keychain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-keychain-smoke:
    # A GitHub-hosted runner is discarded after the job, so the smoke may change its System keychain
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Oracle GraalVM 25.5
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          version: '25.5'
          java-version: '25'
          distribution: 'graalvm'

      - name: Cache Maven dependencies
        id: maven-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: macos-maven-native-keychain-smoke-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            macos-maven-native-keychain-smoke-

      - name: Build CLI native image
        run: .github/scripts/mvn-ci.sh '${{ steps.maven-cache.outputs.cache-hit }}' -B -ntp package -Dnative -DskipTests -Dnative.optimization=-Ob -pl cli -am

      - name: Keychain trust smoke
        run: .github/scripts/macos-keychain-smoke.sh cli/target/incus-spawn-*-runner
