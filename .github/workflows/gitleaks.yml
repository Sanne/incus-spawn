name: Gitleaks

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action calls GET .../pulls/{n}/commits and GET .../pulls/{n}/comments on
  # pull_request events with no error handling around either -- without this scope both
  # 403 and crash the step outright. write additionally lets it post its inline PR comment
  # when a leak is found (that call is try/caught, so read alone would degrade gracefully,
  # but write gets the better UX the tool is designed around).
  pull-requests: write

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One gitleaks version for every job, set here rather than left to gitleaks-action's default:
# versions flag different values (#1495), so allowlist-test only vouches for the scans if it runs
# the version they do. 8.27.0 is the version the vendored leaktk ruleset was generated for. A bump
# changes both lines: the checksum is of that release's linux_x64 tarball, which allowlist-test installs.
env:
  GITLEAKS_VERSION: '8.27.0'
  GITLEAKS_SHA256: 'ba75459d765ebc9e940c0123a2d41a29e87be674b5ecaaacd5f82f26009255d5'

jobs:
  # gitleaks' [extend] table can't set both useDefault and path at once, so the
  # leaktk/patterns ruleset (vendored at .gitleaks/leaktk-gitleaks-8.27.0.toml) lives in its
  # own config and runs as a separate pass rather than being merged into .gitleaks.toml. This
  # has to be a second job, not a second step in the same job: gitleaks-action installs the
  # gitleaks binary to a fixed /tmp path, and a second invocation in the same job fails with
  # "Destination file path /tmp/gitleaks.tmp already exists".
  scan-stock:
    if: github.event_name != 'push' || github.ref_name == 'main' || github.event.repository.fork
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks (stock ruleset)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan-leaktk:
    if: github.event_name != 'push' || github.ref_name == 'main' || github.event.repository.fork
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks (leaktk/patterns ruleset)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks-leaktk.toml

  # The scans above check the commits in the push or PR. This checks the allowlists themselves:
  # they must hide fixture values, not fixture files (#1484), so a real-shaped key planted in every
  # test file must be reported by both configs.
  allowlist-test:
    if: github.event_name != 'push' || github.ref_name == 'main' || github.event.repository.fork
    runs-on: ubuntu-26.04
    # Runs a script from the PR itself, so it gets none of the pull-requests scope above.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          # GitHub has answered this download with 503s, 504s and resets for most of an hour
          # (#2042): curl retries any error with backoff, about four minutes of pauses and no
          # new attempt after ten, and the checksum below still decides
          curl -sSfL --retry 8 --retry-all-errors --retry-max-time 600 --connect-timeout 30 --max-time 300 -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Check the allowlists against planted keys
        run: bash .github/scripts/test-gitleaks-allowlist.sh /tmp/gitleaks
