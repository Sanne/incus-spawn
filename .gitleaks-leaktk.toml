title = "incus-spawn gitleaks config (leaktk/patterns ruleset)"

# gitleaks' extend table is mutually exclusive between "path" and "useDefault"
# (see gitleaks/config/config.go), so this ruleset lives in a second config
# file rather than being merged into the root .gitleaks.toml, which extends
# useDefault instead. CI runs both configs as separate scans.
[extend]
path = ".gitleaks/leaktk-gitleaks-8.27.0.toml"

# Neither leaktk/patterns nor gitleaks' defaults (see .gitleaks.toml) have an
# Anthropic-specific rule. Gated on length, not just the prefix: real keys run 90+ chars
# past the prefix, while every fake fixture in this repo tops out at 28 -- so this catches
# a real leak without re-flagging the placeholders the allowlist below already covers.
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api03-[A-Za-z0-9_-]{40,}'''
tags = ["type:secret", "type:crd", "alert:repo-owner"]
keywords = ["sk-ant-api03-"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth Token"
regex = '''sk-ant-oat01-[A-Za-z0-9_-]{40,}'''
tags = ["type:secret", "type:crd", "alert:repo-owner"]
keywords = ["sk-ant-oat01-"]

[allowlist]
  description = "Synthetic credentials used by config/proxy unit tests, never real secrets"

  # Only the vendored leaktk/patterns ruleset file is allowlisted by path: it is a pattern
  # database, and its own rule definitions and example strings look like credentials to a
  # scanner. Test fixtures are allowlisted by exact value below, never by file, so a real
  # key pasted into a fixture is still flagged.
  paths = [
    '''^\.gitleaks/leaktk-gitleaks-[0-9.]+\.toml$''',
  ]

  # Each entry is anchored ^...$ to the whole captured secret: with regexTarget left at
  # its default, gitleaks matches these against the secret, not the line. Fixture entries
  # list exact values, or shapes no service issues: a prefix net such as sk-ant-api03-
  # plus a few characters would also hide a short real secret in any file. Other fake keys
  # stay under the anthropic rules' 40-char length gate.
  regexes = [
    # Exact synthetic accounts in the #1107 proxy/passthrough regression tests.
    '''^(?:Bearer )?(?:tpt_placeholder|inner-account-B|sk-ant-oat01-outer)$''',
    # Exact placeholder keys of the credential, account and config-compat tests, as leaktk's
    # Generic Secret rule captures them from key: and token: lines.
    '''^sk-ant-api03-(?:fixture|flat|found|good|old|personal|real|stale|work|xyz)$''',
    '''^sk-ant-oat01-(?:fixture|legacy|real)$''',
    # SecretRedactorTest's Basic auth header: base64 of the bare prefix "x-access-token:ghp_".
    '''^eC1hY2Nlc3MtdG9rZW46Z2hwXw==$''',
    # Per-start proof tokens in the guest-script tests (#1108): a tool's placeholder prefix,
    # then isx_ and hex. Not a credential shape any service issues, and capped at 40 hex.
    '''^(?:gho_|sk-ant-|sk-|ya29\.)isx_[0-9a-f]{8,40}$''',
    # #1332's ChatGPT fixtures: ChatGptProofTest's pinned HMAC test vector, RFC 6455's sample
    # WebSocket key, and the end-to-end script's refresh placeholder, a shell variable reference.
    '''^1f9f4bb27ccf73b6b3b1043fa1381ca38631be1068353fe4b30e89e7929b0eb1$''',
    '''^dGhlIHNhbXBsZSBub25jZQ==$''',
    '''^rt\.isx_\$REFRESH_PROOF$''',
  ]
