quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.stderr=true

# Native image config
quarkus.ssl.native=true
quarkus.native.builder-image=container-registry.oracle.com/graalvm/native-image:latest
quarkus.native.auto-service-loader-registration=false
quarkus.native.resources.includes=images/*.yaml,tools/*.yaml,git-remote-isx,dev/tamboui/tui/bindings/*.properties,META-INF/services/org.aesh.terminal.provider.TerminalProvider
quarkus.native.additional-build-args=--initialize-at-run-time=dev.incusspawn.Environment\\,dev.incusspawn.RuntimeServices\\,dev.tamboui.tui\\,dev.tamboui.toolkit\\,dev.tamboui.terminal\\,dev.tamboui.capability\\,dev.tamboui.error\\,dev.tamboui.widget,\
  -Os,--gc=serial
